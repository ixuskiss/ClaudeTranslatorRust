[package]
name = "ct-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
ct-core = { path = "../ct-core" }
ct-llm = { path = "../ct-llm" }
ct-win = { path = "../ct-win" }
tracing.workspace = true

[dev-dependencies]
raw-window-handle = "0.6.2"
slint = { version = "1.19.0", features = ["raw-window-handle-06"] }
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_System_Threading"] }
